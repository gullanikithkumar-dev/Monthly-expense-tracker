<!DOCTYPE html>
<html>
<head>
<title>Edit Expense</title>

<style>
body{
margin:0;
font-family:'Segoe UI';
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* CARD */
.container{
background:white;
padding:30px;
border-radius:16px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fadeIn 0.5s ease;
}

/* ANIMATION */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h2{
text-align:center;
margin-bottom:20px;
}

/* INPUTS */
.input-group{
display:flex;
align-items:center;
margin:10px 0;
background:#f3f4f6;
padding:10px;
border-radius:8px;
}

.input-group span{
margin-right:8px;
}

input, select{
border:none;
background:none;
outline:none;
width:100%;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#6366f1;
color:white;
border:none;
border-radius:8px;
margin-top:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4f46e5;
transform:scale(1.03);
}

/* BACK LINK */
a{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#6366f1;
}
</style>

</head>

<body>

<div class="container">

<h2>✏️ Edit Expense</h2>

<form method="POST">

<div class="input-group">
<span>📝</span>
<input type="text" name="title" value="{{ expense.title }}" required>
</div>

<div class="input-group">
<span>💰</span>
<input type="number" name="amount" value="{{ expense.amount }}" required>
</div>

<div class="input-group">
<span>📂</span>
<select name="category">
<option {% if expense.category=='Food' %}selected{% endif %}>Food</option>
<option {% if expense.category=='Travel' %}selected{% endif %}>Travel</option>
<option {% if expense.category=='Shopping' %}selected{% endif %}>Shopping</option>
<option {% if expense.category=='Bills' %}selected{% endif %}>Bills</option>
<option {% if expense.category=='Other' %}selected{% endif %}>Other</option>
</select>
</div>

<div class="input-group">
<span>📅</span>
<input type="date" name="date" value="{{ expense.date }}" required>
</div>

<button>💾 Update Expense</button>

</form>

<a href="/dashboard">⬅ Back</a>

</div>

</body>
</html>
