<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
background:linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Segoe UI;
}

.box{
background:white;
padding:40px;
border-radius:16px;
width:330px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fade 0.5s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(30px);}
to{opacity:1;}
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
background:#6366f1;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#4f46e5;
}

a{
display:block;
margin-top:10px;
text-decoration:none;
color:#6366f1;
}
</style>

</head>

<body>

<div class="box">
    <h2><header>Expense Tracker</header></h2>

<h2>🔐 Login</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
<script>
alert("{{ messages[0] }}")
</script>
{% endif %}
{% endwith %}

<form method="POST">
<input type="text" name="username" placeholder="👤 Username" required>
<input type="password" name="password" placeholder="🔒 Password" required>

<button>🚀 Login</button>
</form>

<a href="/register">Create account 🎉</a>

</div>

</body>
</html>
